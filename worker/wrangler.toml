name = "jokechatbot"
main = "src/index.js"
compatibility_date = "2026-07-27"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://zhy1126.github.io,http://localhost:8000,http://127.0.0.1:8000"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-v4-flash"
DEEPSEEK_TIMEOUT_MS = "20000"
MAX_SESSION_MESSAGES = "24"

# `npm run worker:deploy` resolves or creates jokechatbot-db and writes its UUID
# into the ignored worker/wrangler.deploy.toml file before deployment.
[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"
